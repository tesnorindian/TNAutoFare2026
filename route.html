<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map & Routing SPA</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      padding: 0 1.5rem;
      background: #1e293b;
      color: white;
      flex-shrink: 0;
    }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 1.25rem;
      font-weight: 500;
    }
    nav a.active, nav a:hover { color: #38bdf8; }

    .view { display: none; flex: 1; height: calc(100vh - 52px); width: 100%; }
    .view.active { display: flex; }

    #sidebar {
      width: 320px;
      padding: 1rem;
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #map {
      flex: 1;
      height: 100%;
      background: #e2e8f0;
    }

    input, button {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }

    #about-view {
      padding: 2rem;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      gap: 1rem;
      width: 100%;
    }
    .route-card {
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <nav>
    <strong>RouteFinder SPA</strong>
    <div>
      <a href="#/map" id="nav-map" class="active">Map & Routing</a>
      <a href="#/saved" id="nav-saved">Saved Routes</a>
    </div>
  </nav>

  <main id="map-view" class="view active">
    <aside id="sidebar">
      <h3>Plan a Route</h3>
      <p style="font-size: 0.85rem; color: #475569;">
        Enter places or click two points directly on the map.
      </p>
      <input type="text" id="start-input" placeholder="Start (e.g., Marina Beach, Chennai)" />
      <input type="text" id="end-input" placeholder="Destination (e.g., Chennai Central)" />
      <button id="route-btn">Get Directions</button>
      <button id="save-btn" class="secondary">Save Current Route</button>
      <button id="clear-btn" class="secondary">Clear Map</button>
      <div id="status" style="font-size: 0.85rem; color: #0f172a;">Loading map libraries...</div>
    </aside>
    <div id="map"></div>
  </main>

  <section id="saved-view" class="view">
    <div id="about-view">
      <h2>Saved Routes</h2>
      <p style="color: #475569;">Routes saved during your session appear here.</p>
      <div id="saved-list">No routes saved yet.</div>
    </div>
  </section>

  <script>
    // Dynamically inject CSS and JS so copy-paste tools cannot truncate the URLs
    function loadCSS(parts) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = parts.join('');
      document.head.appendChild(link);
    }

    function loadScript(parts) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = parts.join('');
        script.onload = resolve;
        script.onerror = () => reject(new Error('Failed to load: ' + script.src));
        document.body.appendChild(script);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      const cdnBase = ['https://', 'cdnjs.cloudflare.com', '/ajax/libs/'];

      try {
        loadCSS([...cdnBase, 'leaflet/1.9.4/leaflet.css']);
        loadCSS([...cdnBase, 'leaflet-routing-machine/3.2.12/leaflet-routing-machine.css']);

        await loadScript([...cdnBase, 'leaflet/1.9.4/leaflet.js']);
        await loadScript([...cdnBase, 'leaflet-routing-machine/3.2.12/leaflet-routing-machine.js']);

        statusEl.textContent = '';
        initApp();
      } catch (err) {
        statusEl.innerHTML = `<strong style="color:red;">Error:</strong> ${err.message}`;
      }
    });

    function initApp() {
      const statusEl = document.getElementById('status');
      const map = L.map('map').setView([13.0827, 80.2707], 12);

      const tileUrl = ['https://', '{s}.basemaps.cartocdn.com', '/rastertiles/voyager/{z}/{x}/{y}{r}.png'].join('');
      L.tileLayer(tileUrl, {
        maxZoom: 19,
        attribution: 'OpenStreetMap & CARTO'
      }).addTo(map);

      setTimeout(() => map.invalidateSize(), 200);

      const routingControl = L.Routing.control({
        waypoints: [],
        routeWhileDragging: true,
        showAlternatives: false
      }).addTo(map);

      const savedRoutes = [];

      const views = {
        '/map': document.getElementById('map-view'),
        '/saved': document.getElementById('saved-view')
      };
      const navLinks = {
        '/map': document.getElementById('nav-map'),
        '/saved': document.getElementById('nav-saved')
      };

      function handleRoute() {
        const hash = window.location.hash.replace('#', '') || '/map';
        Object.keys(views).forEach(route => {
          views[route].classList.toggle('active', route === hash);
          navLinks[route].classList.toggle('active', route === hash);
        });
        if (hash === '/map') setTimeout(() => map.invalidateSize(), 150);
        if (hash === '/saved') renderSavedRoutes();
      }

      window.addEventListener('hashchange', handleRoute);

      async function geocode(query) {
        const geoBase = ['https://', 'photon.komoot.io', '/api/?limit=1&q='].join('');
        const res = await fetch(geoBase + encodeURIComponent(query));
        const data = await res.json();
        if (!data.features || data.features.length === 0) {
          throw new Error(`Location not found: ${query}`);
        }
        const coords = data.features.at(0).geometry.coordinates;
        return L.latLng(coords.at(1), coords.at(0));
      }

      document.getElementById('route-btn').addEventListener('click', async () => {
        const startText = document.getElementById('start-input').value.trim();
        const endText = document.getElementById('end-input').value.trim();
        if (!startText || !endText) {
          statusEl.textContent = 'Please enter both a start and destination.';
          return;
        }

        try {
          statusEl.textContent = 'Finding locations...';
          const [startCoords, endCoords] = await Promise.all([geocode(startText), geocode(endText)]);
          routingControl.setWaypoints([startCoords, endCoords]);
          statusEl.textContent = 'Route calculated. Drag waypoints to adjust.';
        } catch (err) {
          statusEl.textContent = err.message;
        }
      });

      let clickCount = 0;
      map.on('click', (e) => {
        if (clickCount === 0) {
          routingControl.setWaypoints([e.latlng]);
          statusEl.textContent = 'Start point set. Click destination on map.';
          clickCount = 1;
        } else {
          const firstWaypoint = routingControl.getWaypoints().at(0);
          routingControl.setWaypoints([firstWaypoint.latLng, e.latlng]);
          statusEl.textContent = 'Route calculated!';
          clickCount = 0;
        }
      });

      document.getElementById('save-btn').addEventListener('click', () => {
        const waypoints = routingControl.getWaypoints().filter(wp => wp.latLng);
        if (waypoints.length < 2) {
          statusEl.textContent = 'Calculate a route before saving.';
          return;
        }
        const first = waypoints.at(0).latLng;
        const last = waypoints.at(-1).latLng;
        const startName = document.getElementById('start-input').value || `${first.lat.toFixed(3)}, ${first.lng.toFixed(3)}`;
        const endName = document.getElementById('end-input').value || `${last.lat.toFixed(3)}, ${last.lng.toFixed(3)}`;
        savedRoutes.push({ startName, endName, waypoints: waypoints.map(w => w.latLng) });
        statusEl.textContent = 'Route saved!';
      });

      document.getElementById('clear-btn').addEventListener('click', () => {
        routingControl.setWaypoints([]);
        document.getElementById('start-input').value = '';
        document.getElementById('end-input').value = '';
        statusEl.textContent = '';
        clickCount = 0;
      });

      function renderSavedRoutes() {
        const listEl = document.getElementById('saved-list');
        if (!savedRoutes.length) {
          listEl.innerHTML = '<p>No routes saved yet.</p>';
          return;
        }
        listEl.innerHTML = savedRoutes.map((r, idx) => `
          <div class="route-card" style="margin-bottom: 0.75rem;">
            <strong>Route #${idx + 1}</strong>: ${r.startName} &rarr; ${r.endName}
            <button style="margin-top: 0.5rem;" onclick="loadRoute(${idx})">Load on Map</button>
          </div>
        `).join('');
      }

      window.loadRoute = (idx) => {
        const route = savedRoutes.at(idx);
        window.location.hash = '#/map';
        routingControl.setWaypoints(route.waypoints);
      };

      handleRoute();
    }
  </script>
</body>
</html>
